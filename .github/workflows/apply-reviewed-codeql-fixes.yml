name: Apply reviewed CodeQL fixes

on:
  push:
    branches:
      - main
    paths:
      - .github/codeql-fix-trigger

permissions:
  contents: write

jobs:
  apply:
    name: Apply reviewed security patch
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply reviewed patch
        shell: bash
        run: |
          git apply --check tools/codeql-reviewed-fixes.patch
          git apply tools/codeql-reviewed-fixes.patch

      - name: Validate patched files
        shell: bash
        run: |
          node --check admin/js/editor-assistant.js
          node --check admin/js/elementor-assistant.js
          node --check admin/js/map-interactions.js
          php -l includes/class-ilsm-admin-assets.php
          php tools/security-invariants.php
          ! grep -F 'String(elementId).replace(/"/g' admin/js/elementor-assistant.js
          grep -F 'new window.DOMParser()' admin/js/editor-assistant.js
          grep -F 'knowledgePageExportBase' includes/class-ilsm-admin-assets.php
          grep -F 'ILSM.knowledgePageExportBase' admin/js/map-interactions.js
          git diff --check

      - name: Commit reviewed fixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin/js/editor-assistant.js admin/js/elementor-assistant.js admin/js/map-interactions.js includes/class-ilsm-admin-assets.php
          git commit -m 'Fix CodeQL security findings'
          git push origin HEAD:main
