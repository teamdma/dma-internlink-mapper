name: Sync reviewed WordPress hardening after CI

on:
  workflow_run:
    workflows: ["Quality and security"]
    types: [completed]

permissions:
  contents: write

jobs:
  sync:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'sync-wordpress-review-hardening-20260820'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted review branch
        uses: actions/checkout@v7
        with:
          ref: sync-wordpress-review-hardening-20260820
          persist-credentials: true
          fetch-depth: 0

      - name: Stop when hardening was already synchronized
        id: gate
        shell: bash
        run: |
          if compgen -G '.github/wp-hardening/part*' > /dev/null; then
            echo 'apply=true' >> "$GITHUB_OUTPUT"
          else
            echo 'apply=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Rebuild and apply reviewed patch
        if: steps.gate.outputs.apply == 'true'
        run: |
          cat .github/wp-hardening/part* > /tmp/wp-review-hardening.patch.gz.b64
          base64 -d /tmp/wp-review-hardening.patch.gz.b64 | gzip -d > /tmp/wp-review-hardening.patch
          git apply --check /tmp/wp-review-hardening.patch
          git apply /tmp/wp-review-hardening.patch

      - name: Validate PHP syntax
        if: steps.gate.outputs.apply == 'true'
        run: find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

      - name: Security invariants
        if: steps.gate.outputs.apply == 'true'
        run: php tools/security-invariants.php

      - name: JavaScript syntax
        if: steps.gate.outputs.apply == 'true'
        run: node tools/js-syntax.mjs

      - name: Verify release metadata
        if: steps.gate.outputs.apply == 'true'
        run: |
          grep -q "Version:     1.0.1" dma-internlink-mapper.php
          grep -q "define( 'ILSM_VERSION', '1.0.1' )" dma-internlink-mapper.php
          grep -q "Tested up to: 7.1" readme.txt
          grep -q "Stable tag: 1.0.1" readme.txt

      - name: Commit synchronized hardening
        if: steps.gate.outputs.apply == 'true'
        run: |
          rm -rf .github/wp-hardening
          rm -f .github/workflows/apply-wp-review-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sync WordPress review security hardening"
          git push origin HEAD:sync-wordpress-review-hardening-20260820
