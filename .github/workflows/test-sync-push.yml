name: Test sync branch write

on:
  push:
    branches: [main]
    paths:
      - .github/test-sync-push-trigger

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: sync-wordpress-review-hardening-20260820
          persist-credentials: true
          fetch-depth: 0
      - run: |
          printf 'workflow push test\n' > .github/workflow-push-test
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflow-push-test
          git commit -m "Test workflow branch write"
          git push origin HEAD:sync-wordpress-review-hardening-20260820
