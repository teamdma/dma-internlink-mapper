name: WordPress Plugin Check

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: plugin-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin-check:
    name: Plugin Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build deterministic production plugin
        run: bash tools/build-release.sh build

      - name: Run WordPress Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: './build/dma-internlink-mapper'

      - name: Upload verified production package
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: dma-internlink-mapper-${{ github.sha }}
          path: |
            build/dma-internlink-mapper.zip
            build/dma-internlink-mapper.zip.sha256
          if-no-files-found: error
          retention-days: 14
