name: Apply final WordPress review hardening

on:
  push:
    branches:
      - sync-wordpress-review-hardening-20260820
    paths:
      - .github/workflows/apply-final-hardening.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted hardening branch
        uses: actions/checkout@v7
        with:
          ref: sync-wordpress-review-hardening-20260820
          persist-credentials: true
          fetch-depth: 0

      - name: Rebuild reviewed patch
        shell: bash
        run: |
          # part00 was accidentally uploaded with 2,000 duplicated bytes from part01.
          # Keep the original 8,000-byte first chunk, then append the remaining chunks.
          head -c 8000 .github/wp-hardening/part00 > /tmp/wp-review-hardening.patch.gz.b64
          cat .github/wp-hardening/part01 \
              .github/wp-hardening/part02 \
              .github/wp-hardening/part03 \
              .github/wp-hardening/part04 \
              .github/wp-hardening/part05 \
              .github/wp-hardening/part06 \
              .github/wp-hardening/part07 >> /tmp/wp-review-hardening.patch.gz.b64

          base64 --decode /tmp/wp-review-hardening.patch.gz.b64 > /tmp/wp-review-hardening.patch.gz
          gzip -t /tmp/wp-review-hardening.patch.gz
          gzip -dc /tmp/wp-review-hardening.patch.gz > /tmp/wp-review-hardening.patch
          git apply --check /tmp/wp-review-hardening.patch
          git apply /tmp/wp-review-hardening.patch

      - name: Keep GitHub release version
        run: |
          sed -i "s/Version:     1.0.0/Version:     1.0.1/" dma-internlink-mapper.php
          sed -i "s/define( 'ILSM_VERSION', '1.0.0' )/define( 'ILSM_VERSION', '1.0.1' )/" dma-internlink-mapper.php
          sed -i "s/Stable tag: 1.0.0/Stable tag: 1.0.1/" readme.txt
          sed -i "s/Tested up to: 7.0/Tested up to: 7.1/" readme.txt

      - name: Validate PHP syntax
        run: find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

      - name: Security invariants
        run: php tools/security-invariants.php

      - name: JavaScript syntax
        run: node tools/js-syntax.mjs

      - name: Verify release metadata
        run: |
          grep -q "Version:     1.0.1" dma-internlink-mapper.php
          grep -q "define( 'ILSM_VERSION', '1.0.1' )" dma-internlink-mapper.php
          grep -q "Tested up to: 7.1" readme.txt
          grep -q "Stable tag: 1.0.1" readme.txt

      - name: Commit synchronized hardening
        run: |
          rm -rf .github/wp-hardening
          rm -f .github/workflows/apply-final-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sync final WordPress review hardening"
          git push origin HEAD:sync-wordpress-review-hardening-20260820
